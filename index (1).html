<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PC Ustasi — Kompyuterni 0 dan yig'ish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0F1E;
    --bg-panel: #121A2E;
    --bg-raised: #17203A;
    --line: #263252;
    --teal: #21E6C1;
    --amber: #FFB454;
    --magenta: #FF5C93;
    --violet: #8C7BFF;
    --text: #EAF0FF;
    --text-dim: #90A0C8;
    --radius: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); overscroll-behavior:none;}
  body{
    font-family:'Inter', sans-serif; color:var(--text);
    background:
      radial-gradient(circle at 15% 0%, rgba(33,230,193,0.10), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(140,123,255,0.12), transparent 45%),
      var(--bg);
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk', sans-serif;}

  /* ---- Top bar ---- */
  .topbar{
    padding:18px 20px 14px;
    display:flex; align-items:center; gap:12px;
  }
  .topbar .mark{
    width:40px; height:40px; border-radius:12px; flex:none;
    background:linear-gradient(135deg,var(--teal),var(--violet));
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .topbar h1{font-size:17px; margin:0; line-height:1.25;}
  .topbar p{margin:2px 0 0; font-size:12.5px; color:var(--text-dim);}

  /* ---- Tabs content ---- */
  .screen{flex:1; overflow-y:auto; padding:0 16px 100px; display:none;}
  .screen.active{display:block;}

  /* ---- Part grid ---- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  .part-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; cursor:pointer; transition:transform .15s ease, border-color .15s ease;
    position:relative; overflow:hidden;
  }
  .part-card:active{transform:scale(0.96);}
  .part-card .swatch{
    width:100%; height:64px; border-radius:12px; margin-bottom:10px;
    display:flex; align-items:center; justify-content:center; font-size:28px;
  }
  .part-card h3{font-size:14px; margin:0 0 4px;}
  .part-card p{font-size:11.5px; color:var(--text-dim); margin:0; line-height:1.4;}
  .part-card .tag{
    position:absolute; top:10px; right:10px; font-size:9.5px; font-weight:600;
    padding:3px 7px; border-radius:20px; background:rgba(255,255,255,0.08); color:var(--text-dim);
  }

  /* ---- Section headers ---- */
  .section-title{display:flex; align-items:baseline; justify-content:space-between; margin:18px 0 10px;}
  .section-title h2{font-size:15px; margin:0;}
  .section-title span{font-size:12px; color:var(--text-dim);}

  /* ---- Assembly screen ---- */
  .stage{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:22px;
    height:280px; position:relative; overflow:hidden; margin-top:10px;
  }
  .stage canvas{width:100% !important; height:100% !important; display:block;}
  .stage .hint{
    position:absolute; bottom:10px; left:0; right:0; text-align:center;
    font-size:10.5px; color:var(--text-dim);
  }
  .progress-row{display:flex; gap:5px; margin:14px 0 4px;}
  .progress-row .dot{height:5px; flex:1; border-radius:4px; background:var(--line);}
  .progress-row .dot.done{background:var(--teal);}
  .progress-row .dot.now{background:var(--amber);}
  .step-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-top:12px;
  }
  .step-card .k{font-size:11px; color:var(--teal); font-weight:600; letter-spacing:.2px;}
  .step-card h3{font-size:17px; margin:6px 0 6px;}
  .step-card p{font-size:13px; color:var(--text-dim); line-height:1.55; margin:0 0 14px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:14px; border:none; border-radius:14px; font-size:14.5px;
    font-weight:600; font-family:inherit; cursor:pointer; color:#08101F;
    background:linear-gradient(135deg,var(--teal),#7CF5D8);
  }
  .btn:active{opacity:0.85;}
  .btn.secondary{
    background:var(--bg-raised); color:var(--text); border:1px solid var(--line);
  }
  .btn.ghost{background:transparent; color:var(--text-dim); border:1px dashed var(--line);}

  /* ---- Quiz ---- */
  .q-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-top:12px;
  }
  .q-card .qnum{font-size:11px; color:var(--violet); font-weight:600;}
  .q-card h3{font-size:15.5px; margin:6px 0 14px; line-height:1.4;}
  .opt{
    padding:13px 14px; border-radius:12px; background:var(--bg-raised);
    border:1px solid var(--line); margin-bottom:9px; font-size:13.5px; cursor:pointer;
  }
  .opt.correct{border-color:var(--teal); background:rgba(33,230,193,0.12);}
  .opt.wrong{border-color:var(--magenta); background:rgba(255,92,147,0.12);}

  /* ---- Bottom nav ---- */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; display:flex;
    background:rgba(10,15,30,0.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    gap:6px;
  }
  .tabbtn{
    flex:1; text-align:center; padding:8px 4px; border-radius:14px; cursor:pointer;
    color:var(--text-dim); font-size:10.5px; font-weight:600;
  }
  .tabbtn .ic{font-size:19px; display:block; margin-bottom:2px;}
  .tabbtn.active{color:var(--teal); background:rgba(33,230,193,0.10);}

  /* ---- Modal ---- */
  .modal-back{
    position:fixed; inset:0; background:rgba(4,7,16,0.72); backdrop-filter:blur(3px);
    display:none; align-items:flex-end; z-index:50;
  }
  .modal-back.show{display:flex;}
  .modal{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:24px 24px 0 0;
    width:100%; padding:18px 18px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
    animation:slideup .22s ease;
  }
  @keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal .grabber{width:36px; height:4px; border-radius:3px; background:var(--line); margin:0 auto 14px;}
  .modal .stage{height:220px;}
  .modal h2{font-size:19px; margin:16px 0 2px;}
  .modal .role{font-size:12px; color:var(--teal); font-weight:600; margin-bottom:12px;}
  .modal p{font-size:13.5px; line-height:1.6; color:#C9D3EE; margin:0 0 10px;}
  .modal .fact{
    margin-top:12px; padding:12px 14px; border-radius:14px; background:rgba(140,123,255,0.10);
    border:1px solid rgba(140,123,255,0.25); font-size:12.5px; color:#D6D2FF;
  }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-140%);
    background:var(--bg-raised); border:1px solid var(--line); padding:11px 18px; border-radius:30px;
    font-size:12.5px; z-index:80; transition:transform .25s ease; white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

  <div class="topbar">
    <div class="mark">🖥️</div>
    <div>
      <h1>PC Ustasi</h1>
      <p>Kompyuterni 0 dan o'rganib, 3D'da yig'amiz</p>
    </div>
  </div>

  <!-- QISMLAR -->
  <section class="screen active" id="screen-parts">
    <div class="section-title"><h2>Kompyuter qismlari</h2><span id="parts-count"></span></div>
    <div class="grid" id="parts-grid"></div>
  </section>

  <!-- YIG'ISH -->
  <section class="screen" id="screen-build">
    <div class="section-title"><h2>0 dan yig'ish</h2><span id="build-step-label"></span></div>
    <div class="progress-row" id="progress-row"></div>
    <div class="stage" id="build-stage"><div class="hint">Sahnani aylantirish uchun barmog'ingiz bilan torting</div></div>
    <div class="step-card" id="step-card"></div>
  </section>

  <!-- TEST -->
  <section class="screen" id="screen-quiz">
    <div class="section-title"><h2>Bilimni sinash</h2><span id="quiz-progress"></span></div>
    <div id="quiz-body"></div>
  </section>

  <div class="tabbar">
    <div class="tabbtn active" data-tab="parts"><span class="ic">🧩</span>Qismlar</div>
    <div class="tabbtn" data-tab="build"><span class="ic">🛠️</span>Yig'ish</div>
    <div class="tabbtn" data-tab="quiz"><span class="ic">🧠</span>Test</div>
  </div>

  <div class="modal-back" id="modal-back">
    <div class="modal" id="modal">
      <div class="grabber"></div>
      <div class="stage" id="modal-stage"></div>
      <div class="role" id="modal-role"></div>
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
      <div class="fact" id="modal-fact"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* =========================================================
   TELEGRAM WEB APP SOZLAMALARI
========================================================= */
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#0A0F1E'); } catch(e){}
  try { tg.setBackgroundColor('#0A0F1E'); } catch(e){}
}
function haptic(type){
  if (tg && tg.HapticFeedback) {
    if (type === 'success' || type === 'error' || type === 'warning') tg.HapticFeedback.notificationOccurred(type);
    else tg.HapticFeedback.impactOccurred(type || 'light');
  }
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* =========================================================
   QISMLAR HAQIDA MA'LUMOT
========================================================= */
const PARTS = [
  { id:'psu', icon:'🔌', color:0x8C7BFF, name:'Quvvat bloki (PSU)', role:'Energiya manbai',
    tag:'1-qadam',
    desc:'Quvvat bloki elektr tarmog\u2019idagi tokni kompyuter qismlari uchun xavfsiz kuchlanishga aylantiradi va har bir qismga kabel orqali energiya yetkazadi.',
    fact:'Qiziq fakt: quvvati kuchli video karta ishlatsangiz, PSU quvvati (Watt) ham yetarlicha katta bo\u2019lishi kerak, aks holda kompyuter o\u2019chib qolishi mumkin.' },
  { id:'mb', icon:'🧠', color:0x21E6C1, name:'Ona plata (Motherboard)', role:'Barcha qismlarning uyi',
    tag:'2-qadam',
    desc:'Ona plata — barcha qismlarni bir-biriga ulaydigan asosiy plata. Protsessor, xotira, videokarta va boshqa qurilmalar aynan shu plataga o\u2019rnatiladi.',
    fact:'Qiziq fakt: ona platadagi kichik "chipset" nomli mikrosxema barcha qismlar orasidagi "muloqotni" boshqaradi.' },
  { id:'cpu', icon:'⚙️', color:0xFFB454, name:'Protsessor (CPU)', role:'Kompyuterning miyasi',
    tag:'3-qadam',
    desc:'Protsessor barcha hisob-kitoblarni bajaradi — dastur buyruqlarini o\u2019qiydi va ularni bajarib, natijani boshqa qismlarga uzatadi.',
    fact:'Qiziq fakt: zamonaviy protsessorlarda milliardlab kichik tranzistorlar joylashgan bo\u2019lib, ular soniyasiga milliardlab amal bajaradi.' },
  { id:'cooler', icon:'❄️', color:0x6FD8FF, name:'Sovutgich (Cooler)', role:'Protsessorni sovutadi',
    tag:'4-qadam',
    desc:'Ishlash jarayonida protsessor qizib ketadi. Sovutgich issiqlikni protsessordan olib, ventilyator yordamida tashqariga chiqarib yuboradi.',
    fact:'Qiziq fakt: kuchli kompyuterlarda havo o\u2019rniga suyuqlik bilan sovutish (liquid cooling) tizimlaridan ham foydalaniladi.' },
  { id:'ram', icon:'📶', color:0xFF9F45, name:'Operativ xotira (RAM)', role:'Vaqtinchalik xotira',
    tag:'5-qadam',
    desc:'RAM dastur ishlayotgan paytda kerak bo\u2019ladigan ma\u2019lumotlarni vaqtincha saqlaydi. RAM qancha katta bo\u2019lsa, bir vaqtda shuncha ko\u2019p dastur tez ishlaydi.',
    fact:'Qiziq fakt: kompyuter o\u2019chirilganda RAM dagi ma\u2019lumotlar butunlay o\u2019chib ketadi — shuning uchun u "vaqtinchalik" xotira deyiladi.' },
  { id:'storage', icon:'💾', color:0xFF5C93, name:'Xotira (SSD/HDD)', role:'Doimiy saqlash',
    tag:'6-qadam',
    desc:'Xotira qurilmasi fayllar, dasturlar va operatsion tizimni doimiy saqlaydi. SSD — HDD ga qaraganda ancha tezroq ishlaydi.',
    fact:'Qiziq fakt: SSD ichida aylanadigan qismlar yo\u2019q, shuning uchun u HDD ga qaraganda tinch va chidamli ishlaydi.' },
  { id:'gpu', icon:'🎮', color:0x21C1E6, name:'Videokarta (GPU)', role:'Tasvirni chizadi',
    tag:'7-qadam',
    desc:'Videokarta ekranga chiqadigan har bir piksel, o\u2019yin grafikasi va videoni hisoblab, tasvirni shakllantiradi.',
    fact:'Qiziq fakt: kuchli videokartalar sun\u2019iy intellekt va video render qilishda ham keng foydalaniladi.' },
  { id:'case', icon:'🗄️', color:0x9AA6C8, name:'Korpus (Case)', role:'Himoya va tartib',
    tag:'8-qadam',
    desc:'Korpus barcha qismlarni chang, zarba va issiqlikdan himoya qiladi hamda ularni tartibli joylashtirib turadi.',
    fact:'Qiziq fakt: yaxshi shamollatiladigan korpus kompyuter tezligiga ham bilvosita ta\u2019sir qiladi — u nafasi yaxshi ishlaydi!' },
];

/* =========================================================
   3D MODELLARNI YASASH (Three.js, primitive geometriyalar)
========================================================= */
function makeMaterial(color, opts={}){
  return new THREE.MeshStandardMaterial({ color, metalness:opts.metalness ?? 0.35, roughness:opts.roughness ?? 0.45, emissive:opts.emissive ?? 0x000000, emissiveIntensity:opts.emissiveIntensity ?? 0.6 });
}

function buildPartModel(id, accent){
  const g = new THREE.Group();
  switch(id){
    case 'psu': {
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.6,1.6,1.8), makeMaterial(0x2B3350, {metalness:0.7, roughness:0.35}));
      g.add(body);
      const fan = new THREE.Mesh(new THREE.TorusGeometry(0.55,0.08,8,24), makeMaterial(accent, {emissive:accent, emissiveIntensity:0.5}));
      fan.rotation.x = Math.PI/2; fan.position.set(0,0,0.92);
      g.add(fan);
      for(let i=0;i<5;i++){
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.5,0.03), makeMaterial(accent));
        blade.position.set(0,0,0.92);
        blade.rotation.z = i*(Math.PI*2/5);
        g.add(blade);
      }
      for(let i=0;i<3;i++){
        const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.1,8), makeMaterial(0x14182A));
        cable.rotation.z = Math.PI/2 + (i-1)*0.25;
        cable.position.set(-1.6 - i*0.15, -0.2 + i*0.25, 0);
        g.add(cable);
      }
      break;
    }
    case 'mb': {
      const board = new THREE.Mesh(new THREE.BoxGeometry(3.2,0.1,2.6), makeMaterial(accent, {roughness:0.55, metalness:0.15}));
      g.add(board);
      const socket = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.08,0.7), makeMaterial(0x14182A));
      socket.position.set(-0.4,0.09,0); g.add(socket);
      for(let i=0;i<4;i++){
        const slot = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.16,1.4), makeMaterial(0x0E0F1A));
        slot.position.set(0.55 + i*0.18, 0.13, -0.3);
        g.add(slot);
      }
      const pcie = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.12,0.22), makeMaterial(0x1B1E2E));
      pcie.position.set(0.2,0.1,1.0); g.add(pcie);
      const chipset = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.1,0.5), makeMaterial(0x3B4670,{metalness:0.6}));
      chipset.position.set(0.6,0.1,0.9); g.add(chipset);
      break;
    }
    case 'cpu': {
      const base = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.16,1.4), makeMaterial(0xC9A24B,{metalness:0.8, roughness:0.3}));
      g.add(base);
      const die = new THREE.Mesh(new THREE.BoxGeometry(0.85,0.1,0.85), makeMaterial(accent,{emissive:accent, emissiveIntensity:0.7, roughness:0.25}));
      die.position.y = 0.13; g.add(die);
      const grid = new THREE.GridHelper(1.3,10,0x0A0F1E,0x0A0F1E);
      grid.position.y = -0.09; g.add(grid);
      break;
    }
    case 'cooler': {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.6,0.15,24), makeMaterial(0xC9C9D6,{metalness:0.8, roughness:0.2}));
      g.add(base);
      for(let i=0;i<9;i++){
        const fin = new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,0.03,24), makeMaterial(0xB9C4E0,{metalness:0.6}));
        fin.position.y = 0.2 + i*0.13;
        g.add(fin);
      }
      const fan = new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,0.18,24), makeMaterial(0x1B1E2E,{metalness:0.2, roughness:0.7}));
      fan.position.y = 1.65; g.add(fan);
      for(let i=0;i<7;i++){
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.03,0.16), makeMaterial(accent,{emissive:accent, emissiveIntensity:0.5}));
        blade.position.y = 1.65;
        blade.rotation.y = i*(Math.PI*2/7);
        blade.position.x = Math.cos(i)*0.0;
        g.add(blade);
      }
      g.rotation.z = Math.PI/2 * 0; g.position.y = -0.6;
      break;
    }
    case 'ram': {
      const board = new THREE.Mesh(new THREE.BoxGeometry(0.35,2.1,0.06), makeMaterial(0x14182A));
      g.add(board);
      const spreader = new THREE.Mesh(new THREE.BoxGeometry(0.45,1.9,0.14), makeMaterial(accent,{emissive:accent, emissiveIntensity:0.35}));
      g.add(spreader);
      for(let i=0;i<10;i++){
        const pin = new THREE.Mesh(new THREE.BoxGeometry(0.03,0.06,0.06), makeMaterial(0xC9A24B,{metalness:0.8}));
        pin.position.set(0, -1.05, -0.24 + i*0.05);
        g.add(pin);
      }
      break;
    }
    case 'storage': {
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.0,0.22,1.3), makeMaterial(0x181C2E,{metalness:0.4}));
      g.add(body);
      const label = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.02,0.9), makeMaterial(accent,{emissive:accent, emissiveIntensity:0.35}));
      label.position.y = 0.12; g.add(label);
      break;
    }
    case 'gpu': {
      const shroud = new THREE.Mesh(new THREE.BoxGeometry(2.8,0.55,1.3), makeMaterial(0x1D2238,{metalness:0.5, roughness:0.35}));
      g.add(shroud);
      for(let i=-1;i<=1;i+=2){
        const fan = new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.1,20), makeMaterial(0x0E0F1A));
        fan.rotation.x = Math.PI/2; fan.position.set(i*0.72,0.31,0);
        g.add(fan);
        for(let b=0;b<6;b++){
          const blade = new THREE.Mesh(new THREE.BoxGeometry(0.35,0.02,0.1), makeMaterial(accent,{emissive:accent, emissiveIntensity:0.55}));
          blade.position.set(i*0.72,0.37,0);
          blade.rotation.y = b*(Math.PI/3);
          g.add(blade);
        }
      }
      const pcb = new THREE.Mesh(new THREE.BoxGeometry(2.6,0.06,1.1), makeMaterial(0x14182A));
      pcb.position.y = -0.32; g.add(pcb);
      for(let i=0;i<8;i++){
        const pin = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.05), makeMaterial(0xC9A24B,{metalness:0.8}));
        pin.position.set(-1.15 + i*0.05, -0.36, 0.6);
        g.add(pin);
      }
      break;
    }
    case 'case': {
      const shell = new THREE.Mesh(new THREE.BoxGeometry(2.4,3.0,2.0), new THREE.MeshStandardMaterial({color:0x1B2036, metalness:0.4, roughness:0.5, transparent:true, opacity:0.28}));
      g.add(shell);
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(shell.geometry), new THREE.LineBasicMaterial({color:accent}));
      g.add(edges);
      const strip = new THREE.Mesh(new THREE.BoxGeometry(0.04,3.0,0.04), makeMaterial(accent,{emissive:accent, emissiveIntensity:1}));
      strip.position.set(1.15,0,0.95); g.add(strip);
      break;
    }
  }
  return g;
}

/* =========================================================
   3D SAHNANI BOSHQARISH (umumiy funksiya)
========================================================= */
function createScene(container){
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, container.clientWidth/container.clientHeight, 0.1, 100);
  camera.position.set(0,1.1,5.2);
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(3,4,5); scene.add(key);
  const rim = new THREE.DirectionalLight(0x8C7BFF, 0.6);
  rim.position.set(-4,-2,-3); scene.add(rim);

  const holder = new THREE.Group();
  scene.add(holder);

  let dragging=false, lastX=0, lastY=0, velX=0.006, velY=0;
  const dom = renderer.domElement;
  dom.style.touchAction = 'none';
  dom.addEventListener('pointerdown', e=>{dragging=true; lastX=e.clientX; lastY=e.clientY;});
  window.addEventListener('pointerup', ()=>dragging=false);
  window.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    holder.rotation.y += dx*0.008;
    holder.rotation.x = Math.max(-0.6, Math.min(0.6, holder.rotation.x + dy*0.006));
    velX = dx*0.0004;
    lastX=e.clientX; lastY=e.clientY;
  });

  function resize(){
    const w=container.clientWidth, h=container.clientHeight;
    if(!w||!h) return;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  }
  new ResizeObserver(resize).observe(container);

  function animate(){
    requestAnimationFrame(animate);
    if(!dragging) holder.rotation.y += velX;
    velX *= 0.985;
    renderer.render(scene, camera);
  }
  animate();

  return { scene, camera, renderer, holder };
}

/* =========================================================
   QISMLAR EKRANI
========================================================= */
const grid = document.getElementById('parts-grid');
document.getElementById('parts-count').textContent = PARTS.length + ' ta qism';
PARTS.forEach(p=>{
  const card = document.createElement('div');
  card.className='part-card';
  card.innerHTML = `<span class="tag">${p.tag}</span>
    <div class="swatch" style="background:linear-gradient(135deg, #${p.color.toString(16).padStart(6,'0')}33, #${p.color.toString(16).padStart(6,'0')}11)">${p.icon}</div>
    <h3>${p.name}</h3><p>${p.role}</p>`;
  card.onclick = ()=>{ haptic('light'); openModal(p); };
  grid.appendChild(card);
});

let modalScene=null;
function openModal(p){
  document.getElementById('modal-role').textContent = p.role;
  document.getElementById('modal-title').textContent = p.name;
  document.getElementById('modal-desc').textContent = p.desc;
  document.getElementById('modal-fact').textContent = p.fact;
  document.getElementById('modal-back').classList.add('show');
  const stageEl = document.getElementById('modal-stage');
  stageEl.innerHTML='';
  requestAnimationFrame(()=>{
    modalScene = createScene(stageEl);
    const model = buildPartModel(p.id, p.color);
    modalScene.holder.add(model);
    if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeModal); }
  });
}
function closeModal(){
  document.getElementById('modal-back').classList.remove('show');
  if (tg && tg.BackButton) tg.BackButton.hide();
}
document.getElementById('modal-back').addEventListener('click', e=>{ if(e.target.id==='modal-back') closeModal(); });

/* =========================================================
   YIG'ISH REJIMI (0 dan qadam-baqadam)
========================================================= */
const buildStage = document.getElementById('build-stage');
buildStage.innerHTML = '';
const buildScene = createScene(buildStage);
const hintEl = document.createElement('div');
hintEl.className='hint'; hintEl.textContent="Sahnani aylantirish uchun barmog'ingiz bilan torting";
buildStage.appendChild(hintEl);

const STEP_OFFSETS = {
  case:   new THREE.Vector3(0,0,0),
  psu:    new THREE.Vector3(0.65,1.05,-0.3),
  mb:     new THREE.Vector3(-0.15,-0.15,0.15),
  cpu:    new THREE.Vector3(-0.55,0,0.28),
  cooler: new THREE.Vector3(-0.55,0.55,0.28),
  ram:    new THREE.Vector3(0.55,0.05,0.2),
  storage:new THREE.Vector3(0.7,-0.9,-0.3),
  gpu:    new THREE.Vector3(-0.1,-0.35,0.55),
};
const BUILD_ORDER = ['case','psu','mb','cpu','cooler','ram','storage','gpu'];
let buildStep = 0;
const placed = {};

// Boshida bo'sh korpus doim ko'rinib tursin
const caseModel = buildPartModel('case', PARTS.find(p=>p.id==='case').color);
buildScene.holder.add(caseModel);
placed.case = true;

function renderProgress(){
  const row = document.getElementById('progress-row');
  row.innerHTML='';
  BUILD_ORDER.forEach((id,i)=>{
    const d = document.createElement('div');
    d.className='dot' + (i<buildStep ? ' done' : (i===buildStep ? ' now':''));
    row.appendChild(d);
  });
}

function renderStep(){
  const label = document.getElementById('build-step-label');
  const card = document.getElementById('step-card');
  renderProgress();
  if (buildStep >= BUILD_ORDER.length){
    label.textContent = 'Tayyor! 🎉';
    card.innerHTML = `
      <div class="k">YAKUNLANDI</div>
      <h3>Tabriklaymiz, kompyuter yig'ildi! 🎉</h3>
      <p>Siz kompyuterning 8 ta asosiy qismini to'g'ri tartibda joylashtirdingiz. Endi bilimingizni "Test" bo'limida sinab ko'ring.</p>
      <button class="btn" id="go-quiz">🧠 Testga o'tish</button>
      <button class="btn secondary" style="margin-top:10px" id="restart-build">🔁 Qaytadan boshlash</button>
    `;
    document.getElementById('go-quiz').onclick = ()=>{ haptic('light'); switchTab('quiz'); };
    document.getElementById('restart-build').onclick = resetBuild;
    return;
  }
  const id = BUILD_ORDER[buildStep];
  const info = PARTS.find(p=>p.id===id);
  label.textContent = (buildStep+1) + ' / ' + BUILD_ORDER.length;
  card.innerHTML = `
    <div class="k">${info.tag.toUpperCase()}</div>
    <h3>${info.icon} ${info.name}</h3>
    <p>${info.desc}</p>
    <button class="btn" id="place-btn">Joylashtirish</button>
  `;
  document.getElementById('place-btn').onclick = placeCurrentPart;
}

function placeCurrentPart(){
  const id = BUILD_ORDER[buildStep];
  if (id !== 'case'){
    const info = PARTS.find(p=>p.id===id);
    const model = buildPartModel(id, info.color);
    const target = STEP_OFFSETS[id].clone();
    model.position.copy(target).add(new THREE.Vector3(0,2.4,0));
    model.scale.setScalar(0.55);
    buildScene.holder.add(model);
    const start = performance.now();
    const dur = 480;
    function anim(t){
      const p = Math.min(1, (t-start)/dur);
      const ease = 1 - Math.pow(1-p, 3);
      model.position.lerpVectors(target.clone().add(new THREE.Vector3(0,2.4,0)), target, ease);
      if (p<1) requestAnimationFrame(anim); else toast(info.name + ' joylashtirildi ✅');
    }
    requestAnimationFrame(anim);
    haptic('success');
  }
  buildStep++;
  renderStep();
}

function resetBuild(){
  buildScene.holder.clear();
  buildScene.holder.add(caseModel);
  buildStep = 0;
  renderStep();
}
renderStep();

/* =========================================================
   TEST (QUIZ)
========================================================= */
const QUIZ = [
  { q:"Kompyuterning barcha hisob-kitoblarini bajaradigan qism qaysi?", opts:["RAM","Protsessor (CPU)","PSU","Korpus"], correct:1 },
  { q:"Dastur ishlayotganda ma'lumotni vaqtincha saqlaydigan qism-chi?", opts:["SSD","GPU","RAM","Sovutgich"], correct:2 },
  { q:"Ekranga tasvirni chizish uchun qaysi qism javobgar?", opts:["Videokarta (GPU)","Ona plata","PSU","RAM"], correct:0 },
  { q:"Kompyuter o'chirilgach ham fayllar saqlanib qoladigan qism?", opts:["RAM","Sovutgich","Xotira (SSD/HDD)","Protsessor"], correct:2 },
  { q:"Barcha qismlarni bir-biriga ulab turadigan asosiy plata nomi?", opts:["Videokarta","Ona plata (Motherboard)","Quvvat bloki","Korpus"], correct:1 },
];
let quizIndex = 0, quizScore = 0, answered=false;

function renderQuiz(){
  const body = document.getElementById('quiz-body');
  document.getElementById('quiz-progress').textContent = Math.min(quizIndex+1,QUIZ.length) + ' / ' + QUIZ.length;
  if (quizIndex >= QUIZ.length){
    body.innerHTML = `
      <div class="q-card">
        <div class="qnum">NATIJA</div>
        <h3>Siz ${QUIZ.length} tadan ${quizScore} ta savolga to'g'ri javob berdingiz! ${quizScore===QUIZ.length ? '🏆' : '👏'}</h3>
        <button class="btn" id="quiz-send">✅ Natijani yuborish</button>
        <button class="btn secondary" style="margin-top:10px" id="quiz-restart">🔁 Qaytadan boshlash</button>
      </div>`;
    document.getElementById('quiz-send').onclick = ()=>{
      haptic('success');
      if (tg && tg.sendData){
        tg.sendData(JSON.stringify({ type:'quiz_result', score: quizScore, total: QUIZ.length }));
      } else {
        toast('Natija saqlandi (Telegram tashqarisida sinov rejimi)');
      }
    };
    document.getElementById('quiz-restart').onclick = ()=>{ quizIndex=0; quizScore=0; renderQuiz(); };
    return;
  }
  answered=false;
  const item = QUIZ[quizIndex];
  const card = document.createElement('div');
  card.className='q-card';
  card.innerHTML = `<div class="qnum">SAVOL ${quizIndex+1}</div><h3>${item.q}</h3>` +
    item.opts.map((o,i)=>`<div class="opt" data-i="${i}">${o}</div>`).join('');
  body.innerHTML=''; body.appendChild(card);
  card.querySelectorAll('.opt').forEach(el=>{
    el.onclick = ()=>{
      if (answered) return;
      answered = true;
      const i = parseInt(el.dataset.i);
      const opts = card.querySelectorAll('.opt');
      if (i === item.correct){
        el.classList.add('correct'); quizScore++; haptic('success');
      } else {
        el.classList.add('wrong'); opts[item.correct].classList.add('correct'); haptic('error');
      }
      setTimeout(()=>{ quizIndex++; renderQuiz(); }, 750);
    };
  });
}
renderQuiz();

/* =========================================================
   TAB ALMASHTIRISH
========================================================= */
function switchTab(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelector(`.tabbtn[data-tab="${name}"]`).classList.add('active');
}
document.querySelectorAll('.tabbtn').forEach(btn=>{
  btn.onclick = ()=>{ haptic('light'); switchTab(btn.dataset.tab); };
});
</script>
